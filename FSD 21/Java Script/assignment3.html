<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .b {
        height: 600px;
        width: 600px;
        background-color: antiquewhite;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      header {
        display: flex;
        align-items: center;
      }
        .bar {
      height: 50px;
      background-color: rgb(0, 0, 0);
      color: rgb(255, 255, 255);
      width:500px;
      display: flex;
     align-items: center;
     font-size: 20px;
     justify-content: center;
      }
      .form{
        align-self: flex-start;
      }
      
    </style>
  </head>

  <body>
    <div class="b">
      <header>
        <img
          src="bus-logo-design-template-travel-bus-logo-on-white-background-free-vector.jpg"
          alt="logo"
          width="100"
          height="100"
        />
        <h1>BUS BOOKING SYSTEM</h1>
      </header>
     <div class="bar">USER INFORMATION</div> <br>
     <form action="#" class="form">
        <label>Username</label>
        <input type="text" name="Username"> <br> <br>
        <label>Age</label>
        <input type="number" name="Age"> <br> <br>
        <label>Adhar Number</label>
        <input type="number" name="Adhar Number"> <br> <br>
        <label>City</label>
        <select name="city">
            <option value="Delhi">Delhi</option>
            <option value="Kolkata">Kolkata</option>
            <option value="Shimla">Shimla</option>
            <option value="Bangalore">Bangalore</option>
        </select> <br> <br>
        <label>Journey Date</label>
        <input type="date" name="Journey Date"> <br> <br> <br>
     </form>
     <div class="bar">BUS INFORMATION</div> <br>
  </body>
</html>
